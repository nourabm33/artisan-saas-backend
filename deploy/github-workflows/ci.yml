name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker-smoke:
    name: Production image smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: artisan-saas-backend:ci
          build-args: APP_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot stack and probe
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-chars-long
          APP_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3001
          BACKEND_IMAGE: artisan-saas-backend:ci
          METRICS_TOKEN: ci-metrics-token
          APP_RELEASE: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.prod.yml up -d --no-build
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health/ready; then break; fi
            sleep 2
            if [ "$i" = "30" ]; then docker compose -f docker-compose.prod.yml logs; exit 1; fi
          done
          echo
          curl -fsS -o /dev/null -w 'live=%{http_code}\n' http://localhost:3000/api/v1/health/live
          curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" http://localhost:3000/metrics | grep -q artisan_http_requests_total
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/metrics)" = "401"
          docker compose -f docker-compose.prod.yml down -v
